<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Now Playing — Media Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF2E9A'/%3E%3Cstop offset='1' stop-color='%2335E8FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%2305070D'/%3E%3Crect x='14.6' y='7' width='2.8' height='18' rx='1.4' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/tokens.css"/>
<style>
  .wrap{max-width:var(--w-wide); margin:0 auto; padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px);}
  header.top{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s6);}
  h1{font-family:var(--serif); font-weight:600; font-size:clamp(30px,5vw,52px); margin:var(--s1) 0 0; letter-spacing:-.01em;}
  .live-dot{display:inline-flex; align-items:center; gap:var(--s2); font-size:var(--t-meta); color:var(--ink-dim);}
  .live-dot i{width:9px; height:9px; border-radius:var(--r-pill); background:var(--ok);
    box-shadow:0 0 12px -1px color-mix(in srgb, var(--ok) 60%, transparent); animation:pulse 2s var(--ease) infinite;}
  .live-dot.off i{background:var(--muted); box-shadow:none; animation:none;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:var(--s5);}
  .card{display:grid; grid-template-columns:104px 1fr; gap:var(--s4);
    background:linear-gradient(180deg, var(--raised) 0%, var(--surface) 100%);
    border:1px solid var(--line); border-radius:var(--r-lg); padding:var(--s4);
    box-shadow:var(--shadow-md); overflow:hidden; animation:rise .4s var(--ease) both;}
  @keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .poster{width:104px; height:156px; border-radius:var(--r-md); object-fit:cover;
    background:var(--raised-2); border:1px solid var(--line);}
  .meta{min-width:0; display:flex; flex-direction:column; gap:var(--s2);}
  .badge{align-self:flex-start; font-size:var(--t-eyebrow); letter-spacing:.14em; text-transform:uppercase;
    font-weight:700; padding:3px 9px; border-radius:var(--r-pill); color:var(--void);}
  .badge.movie{background:var(--accent-2);} .badge.tv{background:var(--badge-tv);}
  .badge.anime{background:var(--badge-anime);} .badge.other{background:var(--muted);}
  .ttl{font-family:var(--serif); font-size:var(--t-lead); font-weight:600; line-height:1.2;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .sub{font-size:var(--t-meta); color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .who{margin-top:auto; font-size:var(--t-meta); color:var(--muted);}
  .who b{color:var(--ink); font-weight:600;}
  .bar{height:6px; border-radius:var(--r-pill); background:color-mix(in srgb, var(--ink) 12%, transparent); overflow:hidden; margin-top:var(--s1);}
  .bar > i{display:block; height:100%; border-radius:var(--r-pill); background:var(--grad-progress);
    box-shadow:0 0 12px -2px var(--gm); transition:width .6s var(--ease);}
  .times{display:flex; justify-content:space-between; font-size:var(--t-eyebrow); color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums;}
  .paused{color:var(--warn); font-weight:600;}

  .empty{border:1px dashed var(--line-strong); border-radius:var(--r-lg); padding:var(--s8) var(--s5);
    text-align:center; color:var(--ink-dim);}
  .empty h2{font-family:var(--serif); font-weight:600; color:var(--ink); margin:0 0 var(--s2);}
  .empty a{font-weight:600;}
  .hidden{display:none !important;}
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow neon">Media Hub · Live</p>
        <h1>Now Playing</h1>
      </div>
      <span class="live-dot" id="status"><i></i><span id="statusText">connecting…</span></span>
    </header>

    <div class="grid" id="grid"></div>

    <div class="empty hidden" id="empty">
      <h2>Nothing playing right now</h2>
      <p>When someone starts a movie or show, it'll appear here in real time.</p>
    </div>

    <div class="empty hidden" id="signin">
      <h2>Sign in to see the wall</h2>
      <p><a href="/">Head to the front door</a> and log in — the live wall is members-only.</p>
    </div>
  </div>

<script>
  // Follow the visitor's chosen theme (same key/attribute as index.html).
  try { var t = localStorage.getItem('mf-theme'); if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t); } catch (e) {}

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var signin = document.getElementById('signin');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');

  function fmt(sec){ sec = Math.max(0, sec|0); var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); }
  function esc(x){ return (x==null?'':String(x)).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function card(s){
    var kind = (s.kind||'other'); var kindLabel = kind==='tv'?'TV':kind.charAt(0).toUpperCase()+kind.slice(1);
    var poster = s.img_id ? '/api/watching/poster?id='+encodeURIComponent(s.img_id)+'&tag='+encodeURIComponent(s.img_tag||'')+'&h=312' : '';
    var sub = s.series ? esc(s.series) + (s.season? ' · S'+s.season+(s.episode?'E'+s.episode:'') : '') : '';
    var pct = Math.round((s.progress||0)*100);
    var el = document.createElement('div'); el.className='card';
    el.innerHTML =
      (poster ? '<img class="poster" src="'+poster+'" alt="" loading="lazy"/>' : '<div class="poster"></div>') +
      '<div class="meta">' +
        '<span class="badge '+esc(kind)+'">'+esc(kindLabel)+'</span>' +
        '<div class="ttl">'+esc(s.title)+'</div>' +
        (sub ? '<div class="sub">'+sub+'</div>' : '') +
        '<div class="who">'+ (s.paused?'<span class="paused">paused</span> · ':'') +
          '<b>'+esc(s.user||'someone')+'</b>'+ (s.device? ' · '+esc(s.device):'') +'</div>' +
        '<div class="bar"><i style="width:'+pct+'%"></i></div>' +
        '<div class="times"><span>'+fmt(s.elapsed)+'</span><span>-'+fmt(s.remaining)+'</span></div>' +
      '</div>';
    return el;
  }

  function render(snap){
    if (snap && snap.ok === false && /log/i.test(snap.error||'')) { return showSignin(); }
    signin.classList.add('hidden');
    var sessions = (snap && snap.sessions) || [];
    grid.innerHTML = '';
    sessions.forEach(function(s){ grid.appendChild(card(s)); });
    empty.classList.toggle('hidden', sessions.length > 0);
    setStatus(true, sessions.length + (sessions.length===1?' stream':' streams'));
  }
  function showSignin(){ grid.innerHTML=''; empty.classList.add('hidden'); signin.classList.remove('hidden'); setStatus(false,'members only'); }
  function setStatus(on, text){ statusEl.classList.toggle('off', !on); statusText.textContent = text; }

  // Prefer SSE; if the browser or the endpoint won't stream, fall back to polling /now.
  var es;
  function startSSE(){
    try { es = new EventSource('/api/watching/stream'); }
    catch (e) { return startPolling(); }
    es.onmessage = function(ev){ try { render(JSON.parse(ev.data)); } catch(e){} };
    es.onerror = function(){ es.close(); startPolling(); };
  }
  function startPolling(){
    setStatus(false, 'reconnecting…');
    function tick(){
      fetch('/api/watching/now', {credentials:'same-origin'})
        .then(function(r){ if (r.status===401) { showSignin(); throw 'auth'; } return r.json(); })
        .then(render).catch(function(){});
    }
    tick(); setInterval(tick, 5000);
  }
  startSSE();
</script>
</body>
</html>
